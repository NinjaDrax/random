<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Time Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Global Time Converter</h1>
    </header>
    <main>
        <div class="container">
            <div class="clock-card">
                <div class="country-selector">
                    <select id="country1"></select>
                </div>
                <div class="time-display" id="time1"></div>
                <div class="date-display" id="date1"></div>
                <div class="conversion-input">
                    <input type="time" id="input1">
                </div>
            </div>
            <div class="clock-card">
                <div class="country-selector">
                    <select id="country2"></select>
                </div>
                <div class="time-display" id="time2"></div>
                <div class="date-display" id="date2"></div>
                <div class="conversion-input">
                    <input type="time" id="input2">
                </div>
            </div>
            <div class="clock-card">
                <div class="country-selector">
                    <select id="country3"></select>
                </div>
                <div class="time-display" id="time3"></div>
                <div class="date-display" id="date3"></div>
                <div class="conversion-input">
                    <input type="time" id="input3">
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>Powered by WorldTimeAPI</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
